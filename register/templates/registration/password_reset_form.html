<!doctype html>
<html lang="en">
<head>
  <title>Forgot Your Password?</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.9/css/unicons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      line-height: 1.7;
      color: #ffeba7;
      background-color: #1f2029;
      overflow: hidden;
    }

    a:hover {
      text-decoration: none;
    }

    .link {
      color: #ffeba7;
    }

    .link:hover {
      color: #c4c3ca;
    }

    p {
      font-weight: 500;
      font-size: 14px;
    }

    h1 {
      font-weight: 600;
    }

    .section {
      position: relative;
      width: 100%;
      display: block;
    }

    .full-height {
      min-height: 100vh;
    }

    .form-group {
      position: relative;
      display: block;
      margin: 0;
      padding: 0;
    }

    .form-style {
      padding: 13px 20px;
      padding-left: 55px;
      height: 48px;
      width: 100%;
      font-weight: 500;
      border-radius: 4px;
      font-size: 14px;
      line-height: 22px;
      letter-spacing: 0.5px;
      outline: none;
      color: #c4c3ca;
      background-color: #1f2029;
      border: none;
      transition: all 200ms linear;
      box-shadow: 0 4px 8px 0 rgba(21, 21, 21, .2);
    }

    .form-style:focus,
    .form-style:active {
      border: none;
      outline: none;
      box-shadow: 0 4px 8px 0 rgba(21, 21, 21, .2);
    }

    .input-icon {
      position: absolute;
      top: 11;
      left: 12px;
      height: 48px;
      font-size: 24px;
      line-height: 48px;
      text-align: left;
      transition: all 200ms linear;
    }

    .btn {
      border-radius: 4px;
      height: 44px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      transition: all 200ms linear;
      padding: 0 30px;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      background-color: #ffeba7;
      color: #000000;
    }

    .btn:hover {
      background-color: #000000;
      color: #ffeba7;
      box-shadow: 0 8px 24px 0 rgba(16, 39, 112, .2);
    }

  </style>
</head>
<body>
<div class="section">
  <div class="container">
    <div class="row full-height justify-content-center">
      <div class="col-12 text-center align-self-center py-5">
        <div class="section pb-5 pt-5 pt-sm-2 text-center">
          <h1>Forgot your password?</h1>
          <p>Enter your email address below, and we'll email instructions for setting a new one.</p>

          <form method="POST" class="form-group">
            {% csrf_token %}
            <div class="form-group">
              <input type="email" class="form-style" placeholder="Email" name="email" required="" id="id_email">
              <i class="input-icon uil uil-at"></i>
            </div>
            <button type="submit" class="btn mt-4">Send me instructions!</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
